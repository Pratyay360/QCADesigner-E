name: Build AppImage
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Build AppImage inside Docker
        run: |
          docker build \
            --file ContainerFile \
            --target appimage \
            --tag qcadesignere-appimage \
            .

      - name: Extract AppImage from container
        run: |
          id=$(docker create qcadesignere-appimage)
          docker cp "$id:/app/QCADesignerE-x86_64.AppImage" ./QCADesignerE-x86_64.AppImage
          docker rm "$id"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@main
        with:
          name: QCADesignerE-AppImage
          path: QCADesignerE-x86_64.AppImage
          if-no-files-found: error



      - name: Download appdir-lint.sh
        run: |
          curl -fsSL https://raw.githubusercontent.com/AppImageCommunity/pkg2appimage/refs/heads/master/appdir-lint.sh -o appdir-lint.sh
          chmod +x appdir-lint.sh

      - name: Run appdir-lint on the AppImage
        run: ./appdir-lint.sh QCADesignerE-x86_64.AppImage

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: QCADesignerE-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
